# 로컬 개발용 PostgreSQL
services:
  postgres:
    image: postgres:17-alpine
    container_name: ilog-postgres
    environment:
      POSTGRES_DB: ilog
      POSTGRES_USER: ${DB_USERNAME:-ilog}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ilog}
      TZ: UTC
    ports:
      # 로컬에 이미 PostgreSQL 이 5432 를 쓰고 있으면 DB_PORT 로 바꾼다 (예: DB_PORT=55432)
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ilog-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ilog-postgres-data:
